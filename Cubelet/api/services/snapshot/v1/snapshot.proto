syntax = "proto3";

package cubelet.services.snapshot.v1;

option go_package = "github.com/tencentcloud/CubeSandbox/Cubelet/api/services/snapshot/v1;snapshot";

// Snapshot is Cubelet's snapshot control-plane service.
// Status is the upload query CubeMaster polls for remote_status.
// Real upload state will come from cubecow_get_volume_info; that field
// is not ready yet, so S3 Status is mocked ready.
service Snapshot {
  rpc Status(StatusRequest) returns (StatusResponse);
}

message StatusRequest {
  string request_id = 1;
  string snapshot_id = 2;
  // xfs | s3; empty defaults to xfs.
  string backend = 3;
}

message StatusResponse {
  string request_id = 1;
  string snapshot_id = 2;
  string backend = 3;
  // pending | running | ready | failed (upload state)
  string state = 4;
  // Human message; may include remote_uuids JSON when ready.
  string message = 5;
  bool remote_ready = 6;
}
